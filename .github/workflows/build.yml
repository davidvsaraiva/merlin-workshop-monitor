name: CI - build & test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # Source: https://github.com/actions/checkout/tags

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        # Source: https://github.com/actions/setup-java/tags
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        run: |
          mvn -B -ntp -DskipTests=false verify
      - name: Upload snapshot JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        # Source: https://github.com/actions/upload-artifact/tags
        with:
          name: snapshot
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14