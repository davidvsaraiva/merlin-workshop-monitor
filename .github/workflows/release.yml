name: Release - build JARs and upload to GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build (tests on)
        run: |
          mvn -B -ntp -DskipTests=false clean package

      # The created shaded (fat) jar via maven-shade-plugin will be picked up by the glob below.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        # Source: https://github.com/softprops/action-gh-release/tags
        with:
          name: "${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            target/*.jar
            CHANGELOG.md
